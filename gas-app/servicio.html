<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <title>PV-OS - Servicio</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      form { border: 1px solid #ccc; padding: 12px; border-radius: 8px; }
      label { display: block; margin-top: 8px; }
      input, select, textarea { width: 100%; box-sizing: border-box; }
    </style>

  <body>
    <h1>Registrar servicio</h1>
    <nav>
      <a href="?page=index">Inicio</a>
      <a href="?page=entrada">Entrada</a>
      <a href="?page=historial">Historial</a>
      <a href="?page=inventario">Inventario</a>
      <a href="?page=dashboard">Dashboard</a>
    </nav>

    <form id="servicio-form">
      <label>Buscar paciente (ID o nombre)</label>

      <label>Paciente</label>
      <select id="ID_Paciente" name="ID_Paciente"></select>

      <label>Nombre del paciente (opcional)</label>
      <input type="text" name="Nombre_Paciente" />

      <label>Servicio</label>
      <select id="Servicio" name="Servicio" required></select>

      <input type="number" id="Precio" name="Precio" step="0.01" placeholder="Se autocompleta" />
